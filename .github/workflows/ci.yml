name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  higiene:
    name: Higiene (secretos, archivos privados y rutas personales)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv run --no-project python scripts/check_repo.py --strict
      - name: Solo archivos publicables, sin rutas personales ni créditos de herramientas de IA
        run: uv run --no-project python scripts/check_public_files.py
      - name: Mensajes de commit del PR
        if: github.event_name == 'pull_request'
        run: >-
          uv run --no-project python scripts/check_public_files.py
          --commits "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
      - name: Regla «nada nativo» (CLAUDE.md / AGENTS.md)
        run: uv run --no-project python scripts/check_no_native_ui.py

  api:
    name: API (ruff, mypy, pytest, OpenAPI)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv sync --frozen --extra firebase
      - run: uv run --extra firebase ruff check .
      - run: uv run --extra firebase mypy src
      - run: uv run --extra firebase pytest
      - name: OpenAPI sin cambios pendientes
        run: uv run --extra firebase python scripts/export_openapi.py --check

  pipeline:
    name: Pipeline (ruff, pytest sin red ni torch)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: pipeline/uv.lock
      # Sin el extra `laya`: no se descarga PyTorch ni pesos.
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest

  web:
    name: Web (astro check, pruebas, build) con Node 24
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
        env:
          PUBLIC_API_MODE: live
          PUBLIC_AUTH_MODE: local
          PUBLIC_API_URL: ''
      - name: Build público sin cuentas
        run: pnpm exec astro build --outDir dist-public
        env:
          PUBLIC_API_MODE: live
          PUBLIC_AUTH_MODE: public
          PUBLIC_API_URL: ''
      - name: Build online (comprueba que compila con una API alojada; no se publica)
        run: pnpm exec astro build --outDir dist-online
        env:
          PUBLIC_API_MODE: live
          PUBLIC_AUTH_MODE: public
          PUBLIC_API_URL: https://umbral-api.onrender.com
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist-public
          path: apps/web/dist-public
          retention-days: 3

  integracion-e2e:
    name: Integración y E2E (Playwright contra el stack local)
    runs-on: ubuntu-latest
    needs: [higiene, api, pipeline, web]
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tests/.browsers
      UMBRAL_TESTS_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-public
          path: apps/web/dist-public
      - run: uv sync --frozen --project apps/api
      - run: uv sync --frozen --project pipeline
      - run: uv sync --frozen --project tests --extra e2e
      - run: uv run --project tests playwright install --with-deps chromium
      - name: Pruebas de integración y E2E
        run: uv run --frozen --project tests --extra e2e pytest tests -ra --junitxml=tests/.results/ci.xml --screenshot=only-on-failure --tracing=retain-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-pruebas
          path: |
            tests/.results/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
