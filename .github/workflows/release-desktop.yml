name: Release de escritorio

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Compilar y publicar instalador Windows
    runs-on: windows-2022
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: |
            apps/desktop/uv.lock
            apps/api/uv.lock
            pipeline/uv.lock
      - name: Validar que el tag coincide con la versión del instalador
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $package = Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json
          $lock = Get-Content apps/desktop/package-lock.json -Raw | ConvertFrom-Json -AsHashtable
          $runtime = [regex]::Match((Get-Content apps/desktop/pyproject.toml -Raw), '(?m)^version = "([^"]+)"\r?$')
          $version = $package.version
          if ($tag -notmatch '^v\d+\.\d+\.\d+$' -or $tag -ne "v$version") {
            throw "El tag $tag debe ser v$version y usar versionado estable."
          }
          if ($lock['version'] -ne $version -or $lock['packages']['']['version'] -ne $version -or !$runtime.Success -or $runtime.Groups[1].Value -ne $version) {
            throw 'La versión de package.json debe coincidir con los locks de npm y Python.'
          }
          $escapedVersion = [regex]::Escape($version)
          $changelog = Get-Content CHANGELOG.md -Raw
          $notes = [regex]::Match($changelog, "(?ms)^## \[$escapedVersion\][^\r\n]*\r?\n(?<notes>.*?)(?=^## \[|\z)")
          if (!$notes.Success -or !$notes.Groups['notes'].Value.Trim()) {
            throw "Faltan notas de publicación para $version en CHANGELOG.md."
          }
          git fetch origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'El tag de release debe apuntar a un commit integrado en main.' }
      - name: Instalar dependencias de Node con locks
        run: |
          npm ci --prefix apps/desktop
          pnpm --dir apps/web install --frozen-lockfile
      - name: Preparar runtime de escritorio y pipeline Laya calibrada
        shell: pwsh
        env:
          HF_HOME: ${{ github.workspace }}/.production/huggingface
        run: |
          uv sync --locked --project apps/desktop
          uv sync --frozen --project pipeline --extra laya
      - uses: actions/cache@v4
        with:
          path: .production/laya-model
          key: laya-calibrated-${{ hashFiles('eval/prepare_laya_production_model.py', 'eval/finetune_laya.py', 'eval/fit_calibration.py', 'eval/apply_laya_calibration_to_snapshot.py', 'eval/reclassify_laya_snapshot.py', 'eval/run_classification.py', 'eval/aggregate_metrics.py', 'eval/label_provenance.py', 'eval/labels/laya-agent-review-20261007-split.jsonl', 'eval/labels/laya-agent-review-20261007-split.manifest.json', 'data/snapshots/20261007-cfa338b6/manifest.json', 'pipeline/uv.lock', 'pipeline/umbral_pipeline/classify/calibration.py', 'pipeline/umbral_pipeline/classify/laya_clf.py', 'pipeline/umbral_pipeline/refresh.py') }}
      - name: Preparar o comprobar el artefacto Laya calibrado
        shell: pwsh
        env:
          HF_HOME: ${{ github.workspace }}/.production/huggingface
        run: |
          New-Item -ItemType Directory -Path .production -Force | Out-Null
          uv run --frozen --project pipeline --extra laya python eval/prepare_laya_production_model.py `
            --snapshot data/snapshots/20261007-cfa338b6 `
            --labels eval/labels/laya-agent-review-20261007-split.jsonl `
            --model-dir .production/laya-model `
            --work-dir .production/laya-work
      - name: Clasificar el seed de escritorio con el perfil exacto
        id: desktop_snapshot
        shell: pwsh
        env:
          HF_HOME: ${{ github.workspace }}/.production/huggingface
          UMBRAL_LAYA_MODEL_DIR: .production/laya-model
        run: |
          New-Item -ItemType Directory -Path .production -Force | Out-Null
          uv run --frozen --project pipeline --extra laya python eval/reclassify_laya_snapshot.py `
            --snapshot data/snapshots/20261007-cfa338b6 `
            --model-dir .production/laya-model `
            --output-data-dir .production/desktop-data `
            --out .production/desktop-snapshot-receipt.json
          $receipt = Get-Content .production/desktop-snapshot-receipt.json -Raw | ConvertFrom-Json
          if (!$receipt.checks.snapshotVerified -or !$receipt.checks.classifierCalibrated -or !$receipt.checks.allPredictionsCalibrated) {
            throw 'El snapshot inicial de escritorio no quedó verificado con Laya calibrada.'
          }
          "snapshot=$($receipt.snapshotPath)" >> $env:GITHUB_OUTPUT
      - name: Compilar y publicar instalador NSIS con updater
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\apps\desktop\build.ps1 -Installer -Publish -Model .production/laya-model -Snapshot "${{ steps.desktop_snapshot.outputs.snapshot }}"
      - name: Adjuntar SHA-256 del instalador a la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Push-Location apps/desktop/release
          try {
            $checksums = Get-ChildItem -File -Filter '*.sha256' | ForEach-Object { $_.Name }
            if (!$checksums) { throw 'No se generó el SHA-256 del instalador.' }
            foreach ($checksum in $checksums) {
              gh release upload $env:GITHUB_REF_NAME $checksum --repo Tykillita/Umbral --clobber
              if ($LASTEXITCODE -ne 0) { throw "No se pudo adjuntar el checksum $checksum a la release." }
            }
          } finally {
            Pop-Location
          }
