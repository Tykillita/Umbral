<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Umbral</title>
  <desc id="desc">Las fuentes públicas alimentan un pipeline de Python y Laya que publica snapshots verificados. La web alojada usa Firebase Hosting, una API pública de Render e IndexedDB en el navegador. La aplicación de Windows incluye su API, pipeline y modelo, y guarda el trabajo localmente en SQLite.</desc>
