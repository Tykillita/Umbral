<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
  <title id="title">De la señal a la revisión editorial</title>
  <desc id="desc">Cuatro etapas conectadas: fuentes públicas, un snapshot verificado, una agenda de cinco temas y la revisión editorial humana. Nada se publica automáticamente.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 12 6 0 12Z" fill="#172337"/>
    </marker>
  </defs>
  <rect width="1280" height="800" fill="#FFF7DF"/>
  <text x="64" y="68" fill="#172337" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="2.2">DE LA SEÑAL A LA REVISIÓN EDITORIAL</text>
  <path d="M64 96H1216" stroke="#172337" stroke-width="3"/>
  <g fill="none" stroke="#172337" stroke-width="4" marker-end="url(#arrow)">
    <path d="M82 208V288"/>
    <path d="M82 348V428"/>
    <path d="M82 488V568"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172337">
    <g>
      <rect x="132" y="132" width="1072" height="116" fill="#172337"/>
      <rect x="124" y="124" width="1072" height="116" fill="#FFFEF7" stroke="#172337" stroke-width="4"/>
      <path d="M126 128H1194" stroke="#CEE5EC" stroke-width="10"/>
      <circle cx="82" cy="182" r="25" fill="#F7C744" stroke="#172337" stroke-width="4"/>
      <text x="82" y="189" text-anchor="middle" font-size="18" font-weight="800">01</text>
      <text x="164" y="174" font-size="28" font-weight="800">FUENTES PÚBLICAS</text>
      <text x="164" y="208" font-size="20">Titulares de noticias e indicadores oficiales</text>
    </g>
    <g>
      <rect x="132" y="272" width="1072" height="116" fill="#172337"/>
      <rect x="124" y="264" width="1072" height="116" fill="#FFFEF7" stroke="#172337" stroke-width="4"/>
      <path d="M126 268H1194" stroke="#F7C744" stroke-width="10"/>
      <circle cx="82" cy="322" r="25" fill="#F7C744" stroke="#172337" stroke-width="4"/>
      <text x="82" y="329" text-anchor="middle" font-size="18" font-weight="800">02</text>
      <text x="164" y="314" font-size="28" font-weight="800">SNAPSHOT VERIFICADO</text>
      <text x="164" y="348" font-size="20">Clasificación Laya · integridad · SHA-256</text>
    </g>
    <g>
      <rect x="132" y="412" width="1072" height="116" fill="#172337"/>
      <rect x="124" y="404" width="1072" height="116" fill="#FFFEF7" stroke="#172337" stroke-width="4"/>
      <path d="M126 408H1194" stroke="#F7C744" stroke-width="10"/>
      <circle cx="82" cy="462" r="25" fill="#F7C744" stroke="#172337" stroke-width="4"/>
      <text x="82" y="469" text-anchor="middle" font-size="18" font-weight="800">03</text>
      <text x="164" y="454" font-size="28" font-weight="800">AGENDA DE CINCO TEMAS</text>
      <text x="164" y="488" font-size="20">Orden de prioridad, fuentes y puntaje explicado</text>
    </g>
    <g>
      <rect x="132" y="552" width="1072" height="116" fill="#172337"/>
      <rect x="124" y="544" width="1072" height="116" fill="#FFFEF7" stroke="#172337" stroke-width="4"/>
      <path d="M126 548H1194" stroke="#AE342D" stroke-width="10"/>
      <circle cx="82" cy="602" r="25" fill="#F7C744" stroke="#172337" stroke-width="4"/>
      <text x="82" y="609" text-anchor="middle" font-size="18" font-weight="800">04</text>
      <text x="164" y="594" font-size="28" font-weight="800">REVISIÓN HUMANA</text>
      <text x="164" y="628" font-size="20">El equipo revisa y edita; nada se publica automáticamente</text>
    </g>
  </g>
  <path d="M124 704H1196V764H124Z" fill="#CEE5EC" stroke="#172337" stroke-width="4"/>
  <text x="660" y="742" text-anchor="middle" fill="#172337" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing=".5">UNA PERSONA REVISA · NADA SE PUBLICA AUTOMÁTICAMENTE</text>
</svg>