      <g>
        <rect x="714" y="484" width="488" height="82" fill="#FFF7DF" stroke="#172337" stroke-width="3"/>
        <path d="M716 486V564" stroke="#CEE5EC" stroke-width="8"/>
        <text x="740" y="518" font-size="21" font-weight="800">ELECTRON</text>
        <text x="740" y="545" font-size="18">Windows application</text>
      </g>
      <g>
        <rect x="714" y="582" width="488" height="82" fill="#FFF7DF" stroke="#172337" stroke-width="3"/>
        <path d="M716 584V662" stroke="#F7C744" stroke-width="8"/>
        <text x="740" y="616" font-size="21" font-weight="800">BUNDLED RUNTIME</text>
        <text x="740" y="643" font-size="18">API, pipeline and Laya model on CPU</text>
      </g>
      <g>
        <rect x="714" y="680" width="488" height="82" fill="#CEE5EC" stroke="#172337" stroke-width="3"/>
        <path d="M716 682V760" stroke="#F7C744" stroke-width="8"/>
        <text x="740" y="714" font-size="21" font-weight="800">LOCAL SQLITE</text>
        <text x="740" y="741" font-size="18">On-device workspace · offline classification</text>
      </g>
      <text x="716" y="798" font-size="18">Checks for verified updates while connected.</text>
    </g>
  </g>
  <path d="M48 878H1232V938H48Z" fill="#CEE5EC" stroke="#172337" stroke-width="4"/>
  <text x="640" y="916" text-anchor="middle" fill="#172337" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" letter-spacing=".4">VERIFIED DATA IS SHARED · EDITORIAL WORK STAYS SEPARATE</text>
</svg>