        <text x="104" y="518" font-size="21" font-weight="800">FIREBASE HOSTING</text>
        <text x="104" y="545" font-size="18">Static interface and public data feed</text>
      </g>
      <g>
        <rect x="78" y="582" width="488" height="82" fill="#FFF7DF" stroke="#172337" stroke-width="3"/>
