      <text x="82" y="211" font-size="25" font-weight="800">PUBLIC SOURCES</text>
      <text x="82" y="248" font-size="18">News headlines</text>
      <text x="82" y="273" font-size="18">Official indicators</text>
    </g>
    <g>
