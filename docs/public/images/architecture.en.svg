      <path d="M477 134H803" stroke="#F7C744" stroke-width="10"/>
      <text x="501" y="172" font-size="16" font-weight="800" letter-spacing="1.5">02 · PROCESS</text>
      <text x="501" y="211" font-size="25" font-weight="800">PYTHON PIPELINE</text>
      <text x="501" y="248" font-size="18">Laya classification · validation</text>
      <text x="501" y="273" font-size="18">Event grouping · snapshot export</text>
    </g>
    <g>
      <rect x="902" y="138" width="330" height="160" fill="#172337"/>
      <rect x="894" y="130" width="330" height="160" fill="#FFFEF7" stroke="#172337" stroke-width="4"/>
      <path d="M896 134H1222" stroke="#F7C744" stroke-width="10"/>
      <text x="920" y="172" font-size="16" font-weight="800" letter-spacing="1.5">03 · VERIFIED DATA</text>
      <text x="920" y="211" font-size="25" font-weight="800">VERIFIED FEED</text>
      <text x="920" y="248" font-size="18">Versioned snapshot + manifest</text>
      <text x="920" y="273" font-size="18">Integrity checked with SHA-256</text>
    </g>
    <path d="M404 211H459" fill="none" stroke="#172337" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M823 211H878" fill="none" stroke="#172337" stroke-width="5" marker-end="url(#arrow)"/>
    <g fill="none" stroke="#172337" stroke-width="5">
      <path d="M1059 290V341H322V388" marker-end="url(#arrow)"/>
      <path d="M958 341V388" marker-end="url(#arrow)"/>
