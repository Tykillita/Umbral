<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">Umbral architecture</title>
  <desc id="desc">Public sources feed a Python and Laya pipeline that publishes verified snapshots. The hosted web uses Firebase Hosting, a public Render API, and browser IndexedDB. The Windows desktop app bundles its API, pipeline, and model and stores work locally in SQLite.</desc>
  <defs>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="12" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0 14 7 0 14Z" fill="#172337"/>
    </marker>
  </defs>
  <rect width="1280" height="980" fill="#FFF7DF"/>
  <text x="64" y="68" fill="#172337" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" letter-spacing="2">ONE VERIFIED FEED · TWO WORKSPACES</text>
  <path d="M64 96H1216" stroke="#172337" stroke-width="3"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172337">
    <g>
      <rect x="64" y="138" width="330" height="160" fill="#172337"/>
      <rect x="56" y="130" width="330" height="160" fill="#FFFEF7" stroke="#172337" stroke-width="4"/>
      <path d="M58 134H384" stroke="#CEE5EC" stroke-width="10"/>
