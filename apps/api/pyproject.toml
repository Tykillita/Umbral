[project]
name = "umbral-api"
version = "0.3.1"
description = "Umbral API: agenda editorial priorizada con evidencia trazable (MVP hackathon TVN)"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "google-genai>=1.0",
    "httpx>=0.27",
    "PyJWT[crypto]>=2.10,<3",
]

[project.optional-dependencies]
# Persistencia/auth web (Render + Firebase Spark). No se necesita en local.
firebase = ["firebase-admin>=6.5", "google-cloud-firestore>=2.19", "cryptography>=43"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "pytest-cov>=5"]

[project.scripts]
umbral-api = "umbral_api.main:run"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
filterwarnings = ["ignore::DeprecationWarning", "ignore:Using .httpx. with"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
